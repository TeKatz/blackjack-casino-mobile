name: Android visual regression
on:
  push:
    branches: ['mobile/**', 'fix/**']
    paths: ['tools/mobile/visual_smoke.py', 'tools/mobile/visual-smoke-source.json', '.github/workflows/visual-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned APK for harness-only iteration
        id: source
        run: |
          python - <<'PYTHON'
          import json,os
          source=json.load(open('tools/mobile/visual-smoke-source.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            out.write(f"run_id={source['run_id']}\nrevision={source['revision']}\n")
          PYTHON
      - uses: actions/download-artifact@v4
        with:
          name: BlackjackEmpire-debug-apk
          path: test-apk
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Verify exact APK source revision
        env:
          EXPECTED: ${{ steps.source.outputs.revision }}
        run: grep -F "$EXPECTED" test-apk/build-revision.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==13.0.0
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real Android UI and capture visual proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: python tools/mobile/visual_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-visual-proof
          path: visual-proof/*
          retention-days: 14
